aid: codecademy
name: Codecademy
description: Codecademy is a New York City–based online learning platform offering
  interactive coding tutorials, career paths, certifications, and bootcamps across
  programming languages, data science, AI, cloud computing, cybersecurity, and web
  development. Founded in 2011 by Zach Sims and Ryan Bubinski, the company built its
  reputation on browser-based interactive exercises that let learners write and execute
  code without local setup, and grew to serve millions of registered learners. Codecademy
  was acquired by Skillsoft in April 2022 for approximately 525 million dollars in
  a cash-and-stock deal, and now operates as the consumer- and individual- developer-facing
  brand within Skillsoft's broader corporate learning portfolio, complementing Skillsoft
  Percipio for enterprise customers. Codecademy's products include the free tier,
  Codecademy Plus, Codecademy Pro, career paths, skill paths, professional certifications,
  full cohort-based bootcamps (via Codecademy and Skillsoft's Global Knowledge arm),
  and a workspaces feature for project work. The company does not expose a public
  developer REST API, SDK, or partner API program for programmatic access to courses,
  progress, or learner data; its primary surface is the codecademy.com web application
  and mobile apps, with enterprise content delivery handled through Skillsoft channels.
